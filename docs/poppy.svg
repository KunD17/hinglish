  <!-- Himalayan blue poppy (Meconopsis) on a flat dark-green background. The background is
       full-bleed so Android can mask the icon to any shape; the flower stays inside the central
       safe zone (radius ~205) that every mask keeps. -->
  <defs>
    <radialGradient id="front" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#3d5fc4"/>
      <stop offset="0.55" stop-color="#5f98e6"/>
      <stop offset="1" stop-color="#9fd0f7"/>
    </radialGradient>
    <radialGradient id="rear" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#2f4aa6"/>
      <stop offset="0.6" stop-color="#4a7fd2"/>
      <stop offset="1" stop-color="#7fb6ec"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#173a26"/>

  <!-- Four broad, crinkled petals: the two behind are a shade darker. Each has a soft wavy rim
       and faint veins. -->
  <g id="petal-shape" style="display:none">
    <path id="p" d="M256 256 C 184 238, 116 158, 148 102 C 166 70, 204 64, 226 78 C 238 60, 274 58, 288 76 C 310 62, 348 72, 362 104 C 394 160, 328 238, 256 256 Z"/>
  </g>
  <g stroke="#2a4596" stroke-width="2" stroke-linejoin="round">
    <use href="#p" fill="url(#rear)" transform="rotate(25 256 256)"/>
    <use href="#p" fill="url(#rear)" transform="rotate(205 256 256)"/>
    <use href="#p" fill="url(#front)" transform="rotate(115 256 256)"/>
    <use href="#p" fill="url(#front)" transform="rotate(295 256 256)"/>
  </g>
  <g id="veins" style="display:none" fill="none" stroke="#c9e6fb" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round">
    <path id="v" d="M256 240 C 240 200, 214 150, 206 106 M256 240 C 256 190, 256 140, 258 92 M256 240 C 272 200, 298 150, 308 106"/>
  </g>
  <g fill="none" stroke="#c9e6fb" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round">
